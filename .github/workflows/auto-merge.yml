name: auto-merge
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  pull-requests: write
  contents: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge ${{ github.event.number }} --auto --squash
        env:
          GH_TOKEN: ${{ github.token }}
